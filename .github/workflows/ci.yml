name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    # Épinglé sur 22.04 : ubuntu-latest (26.04) ne fournit plus de build Python 3.9/3.10.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Installer le paquet et les dépendances de test
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]" pyyaml

      - name: Lancer les tests
        run: pytest -q

  build:
    name: Build & vérification du paquet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build

      - name: Vérifier les métadonnées du paquet
        run: python -m twine check dist/*

      - name: Conserver les artefacts
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
